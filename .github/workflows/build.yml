name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK platform & build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build APK with native build.sh
        run: |
          chmod +x ./build.sh
          # При первом запуске создается конфиг по умолчанию
          ./build.sh || true
          # Запуск сборки
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: free-my-tv-apk
          path: "**/*.apk"
